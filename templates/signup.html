<!DOCTYPE html>
<html lang="en">
<head>
  <title>Signup</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #c8f04c;
      --accent-dark: #a8cf2c;
      --bg: #0e0e10;
      --surface: #18181c;
      --surface2: #222228;
      --border: #2e2e38;
      --text: #f0f0f4;
      --muted: #7a7a8c;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Animated background blobs */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.12;
      pointer-events: none;
      animation: float 10s ease-in-out infinite;
    }
    body::before {
      width: 500px; height: 500px;
      background: var(--accent);
      top: -150px; right: -150px;
    }
    body::after {
      width: 400px; height: 400px;
      background: #5c7fff;
      bottom: -100px; left: -100px;
      animation-delay: -5s;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(30px); }
    }

    .auth-wrapper {
      width: 100%;
      max-width: 460px;
      padding: 1.5rem;
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(32px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.5rem;
      position: relative;
      overflow: hidden;
    }
    .auth-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), #5c7fff, var(--accent));
      background-size: 200%;
      animation: shimmer 3s linear infinite;
    }
    @keyframes shimmer {
      from { background-position: 0%; }
      to { background-position: 200%; }
    }

    .brand-mark {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 2rem;
    }
    .brand-icon {
      width: 36px; height: 36px;
      background: var(--accent);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
    }
    .brand-icon svg { width: 18px; height: 18px; }
    .brand-name {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.1rem;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    h2 {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.9rem;
      color: var(--text);
      letter-spacing: -0.04em;
      line-height: 1.1;
      margin-bottom: 0.4rem;
    }
    .subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 300;
      margin-bottom: 2rem;
    }

    .form-label {
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 0.4rem;
    }

    .form-control {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      padding: 0.75rem 1rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-control::placeholder { color: var(--muted); opacity: 0.6; }
    .form-control:focus {
      background: var(--surface2);
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(200, 240, 76, 0.12);
      color: var(--text);
      outline: none;
    }

    .btn-accent {
      background: var(--accent);
      color: #0e0e10;
      border: none;
      border-radius: 10px;
      padding: 0.8rem 1rem;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.01em;
      width: 100%;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      margin-top: 0.5rem;
    }
    .btn-accent:hover {
      background: var(--accent-dark);
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(200, 240, 76, 0.2);
    }
    .btn-accent:active { transform: translateY(0); }

    .divider {
      display: flex; align-items: center; gap: 1rem;
      margin: 1.5rem 0;
      color: var(--muted);
      font-size: 0.78rem;
      letter-spacing: 0.05em;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1;
      height: 1px; background: var(--border);
    }

    .login-link {
      text-align: center;
      color: var(--muted);
      font-size: 0.88rem;
      margin-top: 1.5rem;
    }
    .login-link a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }
    .login-link a:hover { text-decoration: underline; }

    .input-icon-wrap { position: relative; }
    .input-icon {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      color: var(--muted); pointer-events: none;
    }
    .input-icon-wrap .form-control { padding-right: 2.6rem; }
  </style>
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-card">

    <div class="brand-mark">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#0e0e10" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
        </svg>
      </div>
      <span class="brand-name">Sparks</span>
    </div>

    <h2>Create account</h2>
    <p class="subtitle">Join us today. It only takes a minute.</p>

    <form method="POST" action="/signup">

      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <div class="input-icon-wrap">
          <input type="text" name="name" class="form-control" placeholder="Jane Doe" required>
          <span class="input-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
          </span>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Email Address</label>
        <div class="input-icon-wrap">
          <input type="email" name="email" class="form-control" placeholder="jane@example.com" required>
          <span class="input-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
          </span>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <div class="input-icon-wrap">
          <input type="password" name="password" class="form-control" placeholder="Min. 8 characters" required>
          <span class="input-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </span>
        </div>
      </div>

      <button type="submit" class="btn-accent">Create Account →</button>

    </form>

    <p class="login-link">Already have an account? <a href="/login">Sign in</a></p>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
