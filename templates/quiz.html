<!DOCTYPE html>
<html lang="en">
<head>
  <title>📘 {{ topic | capitalize }} Quiz</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #c8f04c;
      --accent-dark: #a8cf2c;
      --bg: #0e0e10;
      --surface: #18181c;
      --surface2: #222228;
      --border: #2e2e38;
      --text: #f0f0f4;
      --muted: #7a7a8c;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      font-family: 'DM Sans', sans-serif;
      color: var(--text);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      width: 500px; height: 500px;
      background: #5c7fff;
      border-radius: 50%;
      filter: blur(110px);
      opacity: 0.07;
      top: -150px; right: -150px;
      pointer-events: none;
    }

    /* NAV */
    .top-nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.2rem 2.5rem;
      border-bottom: 1px solid var(--border);
      background: rgba(14,14,16,0.85);
      backdrop-filter: blur(12px);
      position: sticky; top: 0; z-index: 100;
    }
    .brand-mark { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .brand-icon {
      width: 34px; height: 34px; background: var(--accent);
      border-radius: 9px; display: flex; align-items: center; justify-content: center;
    }
    .brand-icon svg { width: 16px; height: 16px; }
    .brand-name { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.1rem; color: var(--text); }
    .nav-back {
      display: flex; align-items: center; gap: 6px;
      color: var(--muted); font-size: 0.85rem; font-weight: 500;
      text-decoration: none; padding: 6px 14px;
      border: 1px solid var(--border); border-radius: 8px;
      transition: color 0.2s, border-color 0.2s;
    }
    .nav-back:hover { color: var(--text); border-color: var(--muted); }

    /* MAIN */
    .main {
      max-width: 720px;
      margin: 0 auto;
      padding: 3rem 1.5rem 5rem;
    }

    /* Header */
    .quiz-header {
      margin-bottom: 2.5rem;
      animation: fadeUp 0.5s ease both;
    }
    .quiz-meta {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 0.8rem;
    }
    .quiz-pill {
      font-size: 0.72rem; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      padding: 3px 10px; border-radius: 20px;
      background: rgba(200,240,76,0.12); color: var(--accent);
    }
    .quiz-count { font-size: 0.78rem; color: var(--muted); }
    .quiz-title {
      font-family: 'Syne', sans-serif;
      font-weight: 800; font-size: 2rem;
      letter-spacing: -0.04em; line-height: 1.15;
    }

    /* Progress bar */
    .progress-wrap {
      margin-top: 1.2rem;
      background: var(--surface2);
      border-radius: 99px; height: 4px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; width: 0%;
      background: var(--accent);
      border-radius: 99px;
      transition: width 0.3s ease;
    }
    .progress-label {
      display: flex; justify-content: space-between;
      font-size: 0.72rem; color: var(--muted);
      margin-top: 0.4rem;
    }

    /* Question Cards */
    .question-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.6rem;
      margin-bottom: 1rem;
      animation: fadeUp 0.4s ease both;
    }
    .question-card:nth-child(1)  { animation-delay: 0.05s; }
    .question-card:nth-child(2)  { animation-delay: 0.10s; }
    .question-card:nth-child(3)  { animation-delay: 0.15s; }
    .question-card:nth-child(4)  { animation-delay: 0.20s; }
    .question-card:nth-child(5)  { animation-delay: 0.25s; }

    .q-number {
      font-size: 0.7rem; font-weight: 600;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--accent); margin-bottom: 0.5rem;
    }
    .q-text {
      font-family: 'Syne', sans-serif;
      font-weight: 700; font-size: 1rem;
      line-height: 1.5; margin-bottom: 1.2rem;
    }

    /* Radio options */
    .options-list { display: flex; flex-direction: column; gap: 0.5rem; }
    .option-label {
      display: flex; align-items: center; gap: 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.75rem 1rem;
      cursor: pointer;
      transition: border-color 0.18s, background 0.18s;
      font-size: 0.92rem;
      user-select: none;
    }
    .option-label:hover {
      border-color: rgba(200,240,76,0.4);
      background: rgba(200,240,76,0.05);
    }
    .option-label input[type="radio"] { display: none; }
    .option-dot {
      width: 18px; height: 18px; flex-shrink: 0;
      border: 2px solid var(--border);
      border-radius: 50%;
      transition: border-color 0.18s, background 0.18s;
      display: flex; align-items: center; justify-content: center;
    }
    .option-label input:checked ~ .option-dot {
      border-color: var(--accent);
      background: var(--accent);
    }
    .option-label input:checked ~ .option-dot::after {
      content: '';
      width: 6px; height: 6px;
      background: #0e0e10; border-radius: 50%;
    }
    .option-label:has(input:checked) {
      border-color: rgba(200,240,76,0.5);
      background: rgba(200,240,76,0.07);
    }

    /* Submit */
    .submit-btn {
      background: var(--accent); color: #0e0e10;
      border: none; border-radius: 12px;
      padding: 0.9rem 1rem;
      font-family: 'Syne', sans-serif;
      font-weight: 700; font-size: 1rem;
      width: 100%; cursor: pointer;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      margin-top: 1.5rem;
    }
    .submit-btn:hover {
      background: var(--accent-dark);
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(200,240,76,0.2);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<nav class="top-nav">
  <a class="brand-mark" href="/dashboard">
    <div class="brand-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#0e0e10" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
      </svg>
    </div>
    <span class="brand-name">Sparks</span>
  </a>
  <a href="/dashboard" class="nav-back">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    Dashboard
  </a>
</nav>

<main class="main">

  <div class="quiz-header">
    <div class="quiz-meta">
      <span class="quiz-pill">📘 Quiz</span>
      <span class="quiz-count">{{ questions | length }} Questions</span>
    </div>
    <h1 class="quiz-title">{{ topic | capitalize }}</h1>

    <div class="progress-wrap">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="progress-label">
      <span id="progressText">0 answered</span>
      <span id="progressPct">0%</span>
    </div>
  </div>

  <form method="POST" id="quizForm">
    {% for q in questions %}
    {% set q_index = loop.index0 %}

    <div class="question-card">
      <div class="q-number">Question {{ loop.index }}</div>
      <div class="q-text">{{ q.question }}</div>

      <div class="options-list">
        {% for option in q.options %}
        <label class="option-label">
          <input type="radio" name="q{{ q_index }}" value="{{ option }}" required>
          <span class="option-dot"></span>
          <span>{{ option }}</span>
        </label>
        {% endfor %}
      </div>
    </div>

    {% endfor %}

    <button type="submit" class="submit-btn">Submit Quiz →</button>
  </form>

</main>

<script>
  // Live progress tracker
  const form = document.getElementById('quizForm');
  const fill = document.getElementById('progressFill');
  const txt  = document.getElementById('progressText');
  const pct  = document.getElementById('progressPct');

  const totalQ = form.querySelectorAll('[type="radio"][value]').length
    ? [...new Set([...form.querySelectorAll('[type="radio"]')].map(r => r.name))].length
    : 0;

  function updateProgress() {
    const answered = [...new Set(
      [...form.querySelectorAll('input[type="radio"]:checked')].map(r => r.name)
    )].length;
    const p = totalQ ? Math.round((answered / totalQ) * 100) : 0;
    fill.style.width = p + '%';
    txt.textContent = answered + ' of ' + totalQ + ' answered';
    pct.textContent = p + '%';
  }

  form.addEventListener('change', updateProgress);
  updateProgress();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
