<!DOCTYPE html>
<html lang="en">
<head>
  <title>Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #c8f04c;
      --accent-dark: #a8cf2c;
      --bg: #0e0e10;
      --surface: #18181c;
      --surface2: #222228;
      --border: #2e2e38;
      --text: #f0f0f4;
      --muted: #7a7a8c;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { height: 100%; scroll-behavior: smooth; }

    body {
      background: var(--bg);
      font-family: 'DM Sans', sans-serif;
      color: var(--text);
      min-height: 100vh;
      /* FIX: was overflow:hidden — now allows scrolling on small screens */
      overflow-x: hidden;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Ambient blobs — fixed so they stay in background while scrolling */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.10;
      pointer-events: none;
      animation: float 10s ease-in-out infinite;
      z-index: 0;
    }
    body::before {
      width: 500px; height: 500px;
      background: #5c7fff;
      top: -150px; left: -150px;
    }
    body::after {
      width: 400px; height: 400px;
      background: var(--accent);
      bottom: -100px; right: -100px;
      animation-delay: -5s;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50%       { transform: translateY(28px); }
    }

    /* Centers card vertically, allows scrolling when viewport is short */
    .page-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.25rem 1.5rem;
      position: relative;
      z-index: 1;
    }

    .auth-wrapper {
      width: 100%;
      max-width: 460px;
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(32px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 2.5rem 2.2rem;
      position: relative;
      overflow: hidden;
      box-shadow: 0 24px 64px rgba(0,0,0,0.4);
    }

    /* Shimmer top border */
    .auth-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, #5c7fff, var(--accent), #5c7fff);
      background-size: 200%;
      animation: shimmer 3s linear infinite;
    }
    @keyframes shimmer {
      from { background-position: 0%; }
      to   { background-position: 200%; }
    }

    /* Brand */
    .brand-mark {
      display: inline-flex; align-items: center;
      gap: 10px; margin-bottom: 1.6rem;
      text-decoration: none;
    }
    .brand-icon {
      width: 36px; height: 36px;
      background: var(--accent); border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.2s;
    }
    .brand-mark:hover .brand-icon { transform: rotate(-8deg) scale(1.08); }
    .brand-icon svg { width: 18px; height: 18px; }
    .brand-name {
      font-family: 'Syne', sans-serif; font-weight: 800;
      font-size: 1.1rem; color: var(--text); letter-spacing: -0.02em;
    }

    /* Welcome badge */
    .welcome-badge {
      display: inline-flex; align-items: center; gap: 7px;
      background: rgba(200,240,76,0.08);
      border: 1px solid rgba(200,240,76,0.18);
      border-radius: 20px; padding: 5px 13px;
      font-size: 0.74rem; color: var(--accent);
      font-weight: 500; letter-spacing: 0.05em;
      margin-bottom: 1.1rem;
    }
    .welcome-dot {
      width: 6px; height: 6px;
      background: var(--accent); border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.45; transform: scale(0.75); }
    }

    h2 {
      font-family: 'Syne', sans-serif; font-weight: 800;
      font-size: 2rem; color: var(--text);
      letter-spacing: -0.04em; line-height: 1.1;
      margin-bottom: 0.35rem;
    }
    .subtitle {
      color: var(--muted); font-size: 0.88rem;
      font-weight: 300; margin-bottom: 2rem;
      line-height: 1.6;
    }

    /* Labels */
    .form-label {
      color: var(--muted); font-size: 0.75rem; font-weight: 500;
      letter-spacing: 0.08em; text-transform: uppercase;
      margin-bottom: 0.4rem; display: block;
    }
    .label-row {
      display: flex; align-items: center;
      justify-content: space-between; margin-bottom: 0.4rem;
    }
    .forgot-link {
      color: var(--accent); font-size: 0.75rem; font-weight: 500;
      letter-spacing: 0.03em; text-decoration: none;
      transition: opacity 0.15s;
    }
    .forgot-link:hover { opacity: 0.75; text-decoration: underline; }

    /* Inputs */
    .input-icon-wrap { position: relative; }
    .input-icon {
      position: absolute; right: 14px;
      top: 50%; transform: translateY(-50%);
      color: var(--muted); pointer-events: none;
      transition: color 0.2s;
    }
    .input-icon-wrap:focus-within .input-icon { color: var(--accent); }

    .form-control {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 11px; color: var(--text);
      padding: 0.78rem 2.8rem 0.78rem 1rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem; width: 100%;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }
    .form-control::placeholder { color: var(--muted); opacity: 0.55; }
    .form-control:focus {
      background: #26262e;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(200,240,76,0.11);
      color: var(--text); outline: none;
    }

    /* Password toggle button */
    .toggle-pw {
      position: absolute; right: 14px;
      top: 50%; transform: translateY(-50%);
      background: none; border: none; padding: 0;
      color: var(--muted); cursor: pointer;
      transition: color 0.2s;
    }
    .toggle-pw:hover { color: var(--accent); }

    /* Submit */
    .btn-signin {
      background: var(--accent); color: #0e0e10;
      border: none; border-radius: 11px;
      padding: 0.85rem 1rem;
      font-family: 'Syne', sans-serif;
      font-weight: 700; font-size: 0.95rem;
      letter-spacing: 0.01em; width: 100%;
      cursor: pointer; margin-top: 0.6rem;
      display: flex; align-items: center;
      justify-content: center; gap: 8px;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    }
    .btn-signin:hover {
      background: var(--accent-dark);
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(200,240,76,0.22);
    }
    .btn-signin:active { transform: translateY(0); box-shadow: none; }
    .btn-signin .arrow { transition: transform 0.2s; }
    .btn-signin:hover .arrow { transform: translateX(4px); }

    /* Footer link */
    .signup-link {
      text-align: center; color: var(--muted);
      font-size: 0.86rem; margin-top: 1.6rem;
    }
    .signup-link a {
      color: var(--accent); text-decoration: none;
      font-weight: 500; transition: opacity 0.15s;
    }
    .signup-link a:hover { opacity: 0.75; text-decoration: underline; }

    /* Page footer */
    .page-footer {
      text-align: center; color: var(--muted);
      font-size: 0.74rem;
      padding: 1.2rem 1.25rem 2rem;
      position: relative; z-index: 1;
    }
    .page-footer a { color: var(--muted); text-decoration: underline; }
    .page-footer a:hover { color: var(--text); }
  </style>
</head>
<body>

<div class="page-wrap">
  <div class="auth-wrapper">
    <div class="auth-card">

      <!-- Brand -->
      <a class="brand-mark" href="/">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#0e0e10" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
          </svg>
        </div>
        <span class="brand-name">Sparks</span>
      </a>

      <!-- Badge -->
      <div class="welcome-badge">
        <span class="welcome-dot"></span>
        Welcome back
      </div>

      <h2>Sign in</h2>
      <p class="subtitle">Good to see you again. Let's pick up where you left off.</p>

      <form method="POST" action="/login" novalidate>

        <!-- Email -->
        <div class="mb-3">
          <label class="form-label">Email Address</label>
          <div class="input-icon-wrap">
            <input type="email" name="email" class="form-control"
              placeholder="jane@example.com" required autocomplete="email">
            <span class="input-icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="2"/>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
              </svg>
            </span>
          </div>
        </div>

        <!-- Password -->
        <div class="mb-1">
          <div class="label-row">
            <label class="form-label mb-0">Password</label>
            <a href="/forgot-password" class="forgot-link">Forgot password?</a>
          </div>
          <div class="input-icon-wrap">
            <input type="password" name="password" id="passwordField"
              class="form-control" placeholder="Enter your password"
              required autocomplete="current-password">
            <button type="button" class="toggle-pw" id="togglePw" aria-label="Toggle password visibility">
              <svg id="eyeIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12S5 5 12 5s11 7 11 7-4 7-11 7S1 12 1 12z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-signin">
          Sign In
          <svg class="arrow" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </button>

      </form>

      <p class="signup-link">Don't have an account? <a href="/signup">Create one</a></p>

    </div>
  </div>
</div>

<footer class="page-footer">
  &copy; 2025 Sparks &nbsp;·&nbsp;
  <a href="/privacy">Privacy</a> &nbsp;·&nbsp;
  <a href="/terms">Terms</a>
</footer>

<script>
  // Show / hide password toggle
  const toggleBtn = document.getElementById('togglePw');
  const pwField   = document.getElementById('passwordField');
  const eyeIcon   = document.getElementById('eyeIcon');

  const eyeOpen   = `<path d="M1 12S5 5 12 5s11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>`;
  const eyeClosed = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>`;

  toggleBtn.addEventListener('click', () => {
    const isHidden    = pwField.type === 'password';
    pwField.type      = isHidden ? 'text' : 'password';
    eyeIcon.innerHTML = isHidden ? eyeClosed : eyeOpen;
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
